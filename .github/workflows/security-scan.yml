name: Security Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=high || true
